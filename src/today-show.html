---
title: "Watch Heirloom on the Today Show"
description: "Al Roker called this the ‘Greatest Segment Ever!’. Watch Heirloom on the Today show."
social_image: "/static/images/today-show-still.png"
---
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/favicon.ico" rel="icon" type="image/x-icon"/>

    <title>
      {{title}}
    </title>
    <meta property="og:title" content="{{title}}"/>
    <meta name="twitter:title" content="{{title}}"/>

    {% if description %}
      <meta name="description" content="{{description}}"/>
      <meta property="og:description" content="{{description}}"/>
      <meta name="twitter:description" content="{{description}}"/>
    {% endif %}

    <meta property="og:type" content="website"/>

    {% if social_image %}
      <meta property="og:image" content="{{social_image | absoluteUrl(settings.url) }}"/>
    {% else %}
      <meta property="og:image" content="https://sendheirloom.com/static/images/og-image.png"/>
    {% endif %}

    <meta name="twitter:creator" content="@SendHeirloom"/>
    <meta name="twitter:card" content="summary_large_image"/>

    <style>
      html {
        background: #222;
      }

      html, body {
        margin: 0px;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      section {
        --video-aspect-ratio: 16 / 9;
        --padding: 2em;

        box-sizing: border-box;
        width: calc((100vh - (2 * var(--padding))) * var(--video-aspect-ratio));
        max-width: 100%;
        padding: var(--padding);
      }

      stream {
        display: block;
        width: 1080px;
        max-width: 100%;
        margin: 0 auto;
        box-shadow: 0 0 30px #000;
        box-shadow: 0 0 5vmin #000;
      }

      @media (max-width: 768px) {
        html {
          background: #000;
        }

        section {
          --padding: 0px;
        }

        stream {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <section>
      <stream src="2914c8fa63d3176927dd953d036d634a" controls preload></stream>
      <script data-cfasync="false" defer type="text/javascript" src="https://embed.videodelivery.net/embed/r4xu.fla9.latest.js?video=2914c8fa63d3176927dd953d036d634a"></script>
    </section>
  </body>
</html>
