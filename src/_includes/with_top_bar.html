{% extends "./default.html" %}

{% block top_of_body %}
{% if top_bar.body | trim %}
  <div class="TopBanner">
    {% if top_bar.opener | trim %}
      <span class="TopBanner--accented">{{ top_bar.opener | safe }}:</span>&nbsp;
    {% endif %}

    {{ top_bar.body | safe }}
  </div>
{% endif %}
{% endblock %}
