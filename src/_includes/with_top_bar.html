{% extends "./default.html" %}

{% block top_of_body %}
<div class="TopBanner" hide-until-optimized>
  <span class="TopBanner--accented">Limited Time Offer:</span> Get a 15% off with promo code MOM15.
</div>

<script>
(function(){
  window.dataLayer = window.dataLayer || []

  var show = function(){
    var hidden = document.querySelectorAll('[hide-until-optimized]')
    for (var i=hidden.length; i--;){
      hidden[i].setAttribute('optimized', true)
    }
  }

  setTimeout(show, 2000)

  var prevHide = window.dataLayer.hide && window.dataLayer.hide.end;
  window.dataLayer.hide = {
    end: function(){
      prevHide && prevHide()

      show()
    }
  }
})()
</script>
{% endblock %}
