---
layout: layouts/post
og_type: article
---

<div class="container max-w-2xl mt-6 px-6">
  <div class="pb-5 mb-5">
    <h1 class="font-bold text-3xl font-heading">{{ title }}</h1>
    <p class="text-base leading-6 font-medium font-body text-gray-500">
      <time> {{ date | readableDate }}
        by
        <a>{{ author }}</a>

      </time>
    </p>

  </div>
  <article class="max-w-2xl prose lg:prose-l my-4 mx-auto font-body">
    {{ content | safe }}</article>

</div>
