---
layout: default
---

{% block head %}
  <link rel="stylesheet" href="/static/css/tailwind.css"/>
{% endblock %}

<div class="container max-w-4xl mt-6  px-6">
    <div class="pb-5 mb-5 border-b border-gray-100">
        <h1 class="font-bold text-5xl font-heading">{{title}}</h1>
        <p class="text-base leading-6 font-medium font-body text-gray-500">
            <time> {{ date | readableDate }}
                by
                <a>{{ author }}</a>

            </time>
        </p>

    </div>
    <article class="prose lg:prose-xl my-4 mx-auto font-body">
        {{ content | safe }}</article>

</div>
