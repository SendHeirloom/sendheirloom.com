<!--
customer_video_books: [birthday, family, holiday, memorials, memories, surprises, vacations, wedding]
 -->
<div class="Dialog---backdrop" dialog-backdrop>
  <div class="Dialog Dialog-is-large" aria-labelledby="dialog-order-title" dialog="customer_videos">       
      {%- for item in customer_video_books -%}
        <div step="video-{{item}}" hidden>
          <div class="CustomerVideosModal">
            <div class="AspectRatio" style="--ratio: calc(16 / 9)">
              <video class="AspectRatio--content" loop controls preload="none" src="https://public.sendheirloom.com/customer-videos/{{item | uppercase }}.mp4"></video>
            </div>
          </div>
        </div>
      {%- endfor -%}

      <div step="video-hero-how-it-works" hidden>
        <div class="CustomerVideosModal">
          <div class="AspectRatio" style="--ratio: calc(16 / 9)">
              <iframe sendheirloom-src="https://customer-tczythmrgrruw2zn.cloudflarestream.com/88cdc017794013cd8179b1cf70fe312c/iframe?preload=true&poster=https%3A%2F%2Fcustomer-tczythmrgrruw2zn.cloudflarestream.com%2F88cdc017794013cd8179b1cf70fe312c%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
                      src="https://customer-tczythmrgrruw2zn.cloudflarestream.com/88cdc017794013cd8179b1cf70fe312c/iframe?preload=true&poster=https%3A%2F%2Fcustomer-tczythmrgrruw2zn.cloudflarestream.com%2F88cdc017794013cd8179b1cf70fe312c%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
                      loading="lazy"
                      style="border: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%;"
                      allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
                      allowfullscreen="true"
              ></iframe>              
          </div>
        </div>
      </div>
  </div>
</div>
