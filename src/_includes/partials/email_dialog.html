<div class="Dialog---backdrop" dialog-backdrop>
  <div class="Dialog Dialog-is-small" aria-labelledby="dialog-email-title" dialog="email">
    <h2 class="Dialog--title" id="dialog-email-title">Subscribe to Heirloom</h2>

    <p class="Dialog--subtitle">We would love to stay in touch. Subscribe to our (occasional) emails and receive an instant $10 off your first video book.</p>

    <form dialog-form>
      <div class="Dialog--content" dialog-content>
        <div class="Stack">
          <div class="FormField">
            <div class="FormField--text">
              <label for="input">Email</label>
            </div>
            <input type="email" class="Input" name="email" id="email" spellcheck="false" required dialog-autofocus />
          </div>
        </div>
      </div>

      <div class="Dialog--output" dialog-output></div>

      <div class="Dialog--actions">
        <button class="Button Button-is-bordered Button-is-primary" type="submit" dialog-submit>Subscribe</button>
      </div>
    </form>

    <div class="Dialog--close-positioner">
      <button class="Button Button-is-close" aria-label="Close" dialog-close>
        <svg viewBox="0 0 8 8"><path stroke="currentColor" stroke-width=".75" d="M0 0 L8 8 M8 0 L0 8"/></svg>
      </button>
    </div>
  </div>
</div>
