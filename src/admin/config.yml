backend:
  name: github
  repo: SendHeirloom/sendheirloom.com-cms
  branch: main

media_folder: "src/static/images/uploads"
public_folder: "/static/images/uploads"
media_library:
  name: uploadcare
  config:
    publicKey: 0b06d37093f82aff1ff1
  settings:
    defaultOperations: '/resize/1560x/-/stretch/off/-/format/auto/-/progressive/yes/'

# Please run "npx netlify-cms-proxy-server" for local backend
local_backend: true
publish_mode: editorial_workflow

collections:
  - label: "Blog"
    name: "blog"
    folder: "src/posts"
    create: true
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "date" }
      - label: "Social Image"
        hint: "An image shown with the post when it's shared on Twitter and Facebook"
        name: "social_image"
        widget: "image"
        default: "/static/images/og-image.jpg"
        allow_multiple: false
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Tags"
        name: "tags"
        widget: list
  - label: "Settings"
    name: "settings"
    editor:
      preview: false
    files:
      - label: "Navigation"
        name: "items"
        file: "src/_data/navigation.yaml"
        fields:
          - label: Nav Items
            name: items
            widget: list
            allow_add: false
            collapsed: false
            fields:
              - { label: Title, name: text, widget: string }
              - { label: URL, name: url, widget: string }
      - label: "Meta Settings"
        name: "settings"
        file: "src/_data/settings.yaml"
        fields:
          - { label: Name, name: name, widget: string }
          - { label: URL, name: url, widget: string }
      - label: "Top Bar"
        name: "top_bar"
        file: "src/_data/top_bar.yaml"
        fields:
          - { label: Opener, name: opener, widget: string, hint: "Leave blank for no pink opening phrase", required: false }
          - { label: Body, name: body, widget: string, hint: "Leave blank to hide top bar from homepage", required: false }
          - { label: Link, name: link, widget: string, hint: "Optional URL. When set, the body text becomes a link to it.", required: false }
